[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxways-security-check"
version = "0.1.0"
description = "LinuxWays Security Check"
authors = [{name = "LinuxWays Team"}]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
securecheck = "securecheck:main"

[tool.setuptools]
py-modules = ["securecheck"]
